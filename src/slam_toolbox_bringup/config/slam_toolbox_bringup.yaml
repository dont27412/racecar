# ============================================================
# slam_toolbox 在线建图参数配置
# ============================================================
# 功能：控制 slam_toolbox 使用哪些坐标系/激光数据，以及扫描匹配、回环检测、
#       地图分辨率和优化器等行为。
#
# 建议调参顺序：
#   1. 先确认 map_frame / odom_frame / base_frame / scan_topic 完全正确；
#   2. 再确认激光有效距离和地图 resolution；
#   3. 再调关键帧触发条件 minimum_travel_distance / heading；
#   4. 最后才调扫描匹配、回环检测和搜索空间参数。
#
# 注意：不要一次同时改很多参数，否则很难判断是哪一个参数改善/恶化了结果。

slam_toolbox:
  ros__parameters:

    # --------------------------------------------------------
    # 时间
    # --------------------------------------------------------

    # 功能：决定节点使用系统时间还是 /clock 仿真时间。
    # 参数作用：所有 TF、LaserScan、里程计时间戳都必须与这里的时间基准一致。
    # 怎么设置：
    #   - 实体机器人实时运行：false。
    #   - Gazebo / 仿真 / 使用 rosbag 且发布 /clock：true。
    #   - 设置错误常见表现是 TF extrapolation、消息时间过旧或完全不建图。
    use_sim_time: false

    # --------------------------------------------------------
    # 坐标系与激光话题
    # --------------------------------------------------------

    # 功能：指定 SLAM 全局地图坐标系名称。
    # 参数作用：slam_toolbox 会维护/发布 map -> odom 的变换。
    # 怎么设置：通常保持 map；只有你的整套 TF 命名规范不同才修改。
    map_frame: map

    # 功能：指定机器人里程计坐标系名称。
    # 参数作用：slam_toolbox 需要已有 odom -> base_frame 的 TF，并在此基础上修正 map -> odom。
    # 怎么设置：用 `ros2 run tf2_ros tf2_echo odom akm_rear_axle_footprint` 检查实际 TF 名称；
    #           若你的里程计坐标系不是 odom，则改成真实名称。
    odom_frame: odom

    # 功能：指定机器人底盘参考坐标系。
    # 参数作用：扫描匹配和机器人运动都以这个基座坐标系为参考。
    # 怎么设置：必须与 TF 树中实际运动学参考 frame 一致。
    #           当前 AKM 系统以“后轴中心在地面的投影”为 2D 运动学参考点。
    base_frame: akm_rear_axle_footprint

    # 功能：指定 slam_toolbox 订阅的 LaserScan 话题。
    # 参数作用：这是实际参与建图和扫描匹配的数据源。
    # 怎么设置：
    #   - 直接使用原始雷达：/scan。
    #   - 如果已经启动 laser_deskew，希望使用运动补偿后的数据：改为 /scan_deskewed。
    #   - 可用 `ros2 topic type <话题>` 确认类型必须是 sensor_msgs/msg/LaserScan。
    scan_topic: /scan_deskewed

    # --------------------------------------------------------
    # 工作模式
    # --------------------------------------------------------

    # 功能：选择 slam_toolbox 的工作模式。
    # 参数作用：mapping 用于从零开始建图；其他模式可用于已有地图定位等场景。
    # 怎么设置：当前任务是建图，因此保持 mapping。
    mode: mapping

    # 功能：启用地图保存相关服务/功能。
    # 参数作用：允许通过 slam_toolbox 的保存接口保存当前地图。
    # 怎么设置：需要保存地图时保持 true；极简运行且完全不需要保存时才考虑 false。
    use_map_saver: true

    # 功能：启用 RViz 中 slam_toolbox 的交互式图优化功能。
    # 参数作用：可以在 RViz 中进行节点/回环等交互操作。
    # 怎么设置：调试和人工修图时建议 true；不需要交互功能时可设 false。
    enable_interactive_mode: true

    # --------------------------------------------------------
    # Ceres 后端优化器
    # --------------------------------------------------------

    # 功能：选择位姿图非线性优化器。
    # 参数作用：负责在加入约束和回环后优化整张位姿图。
    # 怎么设置：通常保持官方推荐的 CeresSolver，除非明确知道要更换插件。
    solver_plugin: solver_plugins::CeresSolver

    # 功能：选择 Ceres 的线性求解器。
    # 参数作用：影响大型稀疏位姿图优化的速度和内存占用。
    # 怎么设置：2D SLAM 一般保持 SPARSE_NORMAL_CHOLESKY；没有明确性能问题不要改。
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY

    # 功能：选择 Ceres 预条件器。
    # 参数作用：影响迭代求解收敛速度。
    # 怎么设置：一般保持 SCHUR_JACOBI；只有在明确做优化器性能调优时才修改。
    ceres_preconditioner: SCHUR_JACOBI

    # 功能：选择非线性优化的信赖域策略。
    # 参数作用：决定每次优化迭代如何选择更新步长。
    # 怎么设置：LEVENBERG_MARQUARDT 是稳定常用选择，一般保持不变。
    ceres_trust_strategy: LEVENBERG_MARQUARDT

    # 功能：指定 Dogleg 策略类型。
    # 参数作用：只有选择相关 Dogleg 信赖域策略时才有实际影响。
    # 怎么设置：当前使用 Levenberg-Marquardt，因此通常无需关心/修改。
    ceres_dogleg_type: TRADITIONAL_DOGLEG

    # 功能：设置 Ceres 鲁棒损失函数。
    # 参数作用：鲁棒核可降低异常约束对优化结果的影响。
    # 怎么设置：当前 None 表示不额外使用鲁棒核；没有明确异常约束问题时保持默认。
    ceres_loss_function: None

    # --------------------------------------------------------
    # 数据处理频率、TF 和地图
    # --------------------------------------------------------

    # 功能：控制每隔多少帧 LaserScan 才处理一帧。
    # 参数作用：值越大计算量越低，但参与建图的数据越少。
    # 怎么设置：
    #   - 1：每帧处理，地图质量优先，推荐先用这个。
    #   - CPU 不够时可尝试 2、3，但需要观察地图是否明显变差。
    throttle_scans: 1

    # 功能：设置 map -> odom TF 的发布周期，单位 s。
    # 参数作用：影响下游看到地图坐标变换的更新频率。
    # 怎么设置：当前设为 0.02 s，即 50 Hz 发布 map -> odom TF。
    #           注意：这只是把“最近一次 SLAM 修正”以 50 Hz 持续发布，
    #           不代表 SLAM 每秒产生 50 次新的激光修正；新的激光修正仍由
    #           minimum_time_interval=0.10 和雷达帧率限制在最高约 10 Hz。
    transform_publish_period: 0.02

    # 功能：设置 OccupancyGrid 地图发布/更新间隔，单位 s。
    # 参数作用：值越小 RViz 地图更新越及时，但 CPU 和通信开销更大。
    # 怎么设置：当前设为 1.0 s，即 /map 栅格地图约 1 Hz 更新。
    map_update_interval: 1.0

    # 功能：设置地图栅格分辨率，单位 m/格。
    # 参数作用：决定地图细节程度、内存和计算量。
    # 怎么设置：
    #   - 0.05 = 每格 5 cm，是室内/小车常用起点。
    #   - 想要更细地图可用 0.02~0.03，但计算和内存会增加。
    #   - 大场景且不需要细节可用 0.05~0.10。
    resolution: 0.05

    # 功能：限制两次扫描处理之间的最小时间间隔，单位 s。
    # 参数作用：避免在很短时间内处理过多扫描。
    # 怎么设置：通常不要大于雷达正常周期太多。10 Hz 雷达周期约 0.10 s，当前设 0.10 合理；
    #           若雷达 20 Hz 且希望每帧利用，应减小到约 0.05 或更低。
    minimum_time_interval: 0.10

    # 功能：设置查询 TF 时允许等待的最大时间，单位 s。
    # 参数作用：TF 稍晚到达时，slam_toolbox 会等待这段时间再判定失败。
    # 怎么设置：0.1~0.3 s 常见；频繁 TF timeout 可适当增大，但应先检查 TF 发布是否正常。
    transform_timeout: 0.20

    # 功能：设置内部 TF 缓存保留时长，单位 s。
    # 参数作用：需要查询历史扫描对应 TF 时，缓存过短可能查不到。
    # 怎么设置：一般保持几十秒；30 s 已较宽裕。只有长延迟/离线处理需求才增加。
    tf_buffer_duration: 30.0

    # 功能：设置 slam_toolbox 工作线程栈大小，单位 byte。
    # 参数作用：过小可能在复杂场景/深调用时栈不足；过大增加虚拟内存预留。
    # 怎么设置：当前 40,000,000 byte（约 40 MB）属于较宽裕设置，一般不要修改；
    #           只有明确遇到栈问题或嵌入式内存限制时再调整。
    stack_size_to_use: 40000000

    # --------------------------------------------------------
    # 激光有效距离
    # --------------------------------------------------------

    # 功能：忽略距离雷达太近的点，单位 m。
    # 参数作用：可过滤雷达近场盲区、车体自身反射和不可靠近距离点。
    # 怎么设置：根据雷达规格中的最小有效测距和实际车体遮挡设置；
    #           若 0.20 m 内数据不可靠，保持 0.20。
    min_laser_range: 0.20

    # 功能：忽略距离雷达太远的点，单位 m。
    # 参数作用：远距离点噪声较大时，限制它们参与扫描匹配和建图。
    # 怎么设置：不要超过雷达可靠量程；室内通常无需用到理论最大量程。
    #           若 X10 在实际环境 10 m 内较可靠，可保持 10.0；远处噪声多就调小。
    max_laser_range: 10.0

    # --------------------------------------------------------
    # 扫描匹配 / 关键帧
    # --------------------------------------------------------

    # 功能：启用激光扫描匹配。
    # 参数作用：利用当前扫描与已有扫描/地图的匹配结果修正机器人位姿。
    # 怎么设置：做正常 2D SLAM 应保持 true；关闭后会更依赖里程计，通常不建议。
    use_scan_matching: true

    # 功能：允许扫描匹配利用扫描重心信息。
    # 参数作用：帮助匹配过程选择/优化候选位姿。
    # 怎么设置：通常保持 true；只有针对特定数据做实验比较时才改。
    use_scan_barycenter: true

    # 功能：机器人至少平移多少米后，才把新扫描作为新的关键扫描处理。
    # 参数作用：值越小关键帧越密、计算量越高；值越大关键帧越稀，可能丢失细节。
    # 怎么设置：
    #   - 小型室内车可从 0.05~0.20 m 尝试。
    #   - 地图断层/转弯细节不足可调小；CPU 压力大且运动平稳可适当调大。
    minimum_travel_distance: 0.10

    # 功能：机器人至少旋转多少弧度后，才触发新的关键扫描。
    # 参数作用：控制纯转向或小范围转向时的关键帧密度。
    # 怎么设置：0.10 rad ≈ 5.7°，是常用起点；
    #           原地旋转地图容易断/变形时可调小，例如 0.05；计算量太大可适当调大。
    minimum_travel_heading: 0.10

    # 功能：设置扫描匹配缓冲区保存的历史扫描数量。
    # 参数作用：历史扫描越多，可用于匹配的局部信息越丰富，但计算/内存会增加。
    # 怎么设置：一般 5~20；当前 10 适合作为起点。环境重复、匹配不稳可尝试增加。
    scan_buffer_size: 10

    # 功能：限制扫描缓冲区中历史扫描距离当前扫描的最大空间范围，单位 m。
    # 参数作用：避免用离当前位置太远的局部扫描做普通匹配。
    # 怎么设置：应覆盖正常局部环境尺度；室内可从数米到 10 m 起步。
    #           太小可能匹配信息不足，太大增加计算并可能引入无关结构。
    scan_buffer_maximum_scan_distance: 10.0

    # 功能：设置局部链接精匹配所要求的最小响应值。
    # 参数作用：响应越高，接受一个扫描链接所要求的匹配质量越高。
    # 怎么设置：值调高会更严格、减少错误链接但可能漏掉有效链接；调低相反。
    #           当前 0.10 较宽松，地图正常时建议先保持。
    link_match_minimum_response_fine: 0.10

    # 功能：限制当前扫描和候选链接扫描之间允许的最大距离，单位 m。
    # 参数作用：只在较近扫描之间建立普通局部链接。
    # 怎么设置：应略大于正常关键帧间移动距离；1~2 m 常作为小车室内起点。
    #           太小会少约束，太大可能增加错误候选和计算量。
    link_scan_maximum_distance: 1.5

    # --------------------------------------------------------
    # 回环检测
    # --------------------------------------------------------

    # 功能：开启回环检测。
    # 参数作用：机器人重新经过旧区域时建立约束，用于消除长距离累计漂移。
    # 怎么设置：正常建图建议 true；只有调试回环导致的错误跳变时才临时 false 对比。
    do_loop_closing: true

    # 功能：回环候选搜索的最大空间距离，单位 m。
    # 参数作用：只在当前位姿附近该半径内寻找可能的历史回环候选。
    # 怎么设置：室内可从 2~5 m 起步；太小可能漏回环，太大候选变多、误匹配风险和计算量上升。
    loop_search_maximum_distance: 3.0

    # 功能：一个回环候选链至少需要包含多少连续扫描。
    # 参数作用：要求候选区域有足够历史扫描支持，降低偶然单帧误匹配。
    # 怎么设置：值大更保守、误回环少但更难触发；值小更敏感。
    #           当前 10 是常用的保守起点，回环明显太难触发时可逐步减小。
    loop_match_minimum_chain_size: 10

    # 功能：设置回环粗匹配允许的最大方差。
    # 参数作用：用于剔除不确定性过高的粗回环匹配结果。
    # 怎么设置：一般保持默认/当前值；只有有明确诊断数据证明回环过严或过松时再调。
    loop_match_maximum_variance_coarse: 3.0

    # 功能：设置回环粗匹配的最低响应阈值。
    # 参数作用：粗匹配低于该质量时，不进入更精细的回环确认。
    # 怎么设置：调高更严格、误回环少但可能漏回环；调低更容易触发但风险更高。
    #           当前 0.35 可先保持。
    loop_match_minimum_response_coarse: 0.35

    # 功能：设置回环精匹配的最低响应阈值。
    # 参数作用：最终决定是否接受回环约束，通常应比 coarse 阈值更严格。
    # 怎么设置：出现错误回环导致地图突然拉扯/折叠时可适当调高；
    #           回环一直无法建立且扫描质量良好时可小幅调低。每次只改一点。
    loop_match_minimum_response_fine: 0.45

    # --------------------------------------------------------
    # 普通扫描匹配的相关性搜索空间
    # --------------------------------------------------------

    # 功能：设置普通扫描匹配时平移搜索窗口尺寸，单位 m。
    # 参数作用：里程计误差越大，通常需要更大的搜索窗口才能找到正确匹配，但计算量也更高。
    # 怎么设置：里程计较准时 0.3~0.5 m 常足够；经常匹配丢失可适当增大。
    correlation_search_space_dimension: 0.5

    # 功能：设置普通平移搜索网格的空间分辨率，单位 m。
    # 参数作用：越小搜索越精细但计算越慢。
    # 怎么设置：0.01 m（1 cm）已经较细；算力不足可适当增大，精度要求高且算力足够才减小。
    correlation_search_space_resolution: 0.01

    # 功能：设置普通相关性搜索响应的平滑尺度，单位 m。
    # 参数作用：控制候选响应在空间上的“扩散/平滑”程度，对匹配鲁棒性有影响。
    # 怎么设置：通常保持 0.05~0.1 左右；没有明确匹配问题不建议单独修改。
    correlation_search_space_smear_deviation: 0.1

    # --------------------------------------------------------
    # 回环搜索空间
    # --------------------------------------------------------

    # 功能：设置回环检测使用的平移搜索空间尺寸，单位 m。
    # 参数作用：回环时初始位姿误差可能更大，因此搜索范围通常比普通局部匹配大。
    # 怎么设置：太小会漏掉漂移较大的真实回环；太大计算开销和误匹配机会都会增加。
    #           当前 8.0 m 属于较宽搜索范围。
    loop_search_space_dimension: 8.0

    # 功能：设置回环平移搜索网格分辨率，单位 m。
    # 参数作用：越小越精细但更慢。
    # 怎么设置：0.05 m 是常见折中；如果搜索范围很大，不建议同时把分辨率设得非常小。
    loop_search_space_resolution: 0.05

    # 功能：设置回环搜索响应的平滑尺度，单位 m。
    # 参数作用：影响粗回环候选对小位置误差的容忍程度。
    # 怎么设置：通常保持默认附近；误回环问题优先调响应阈值，而不是先改这个参数。
    loop_search_space_smear_deviation: 0.03

    # --------------------------------------------------------
    # 扫描匹配评分与角度搜索
    # --------------------------------------------------------

    # 功能：对候选位姿“平移偏离预测值”施加惩罚。
    # 参数作用：值越大，匹配器越不愿意偏离里程计/初始预测位置。
    # 怎么设置：里程计很可靠可适当增大；里程计漂移较大、需要激光纠正时不宜过大。
    distance_variance_penalty: 0.5

    # 功能：对候选位姿“角度偏离预测值”施加惩罚。
    # 参数作用：值越大，匹配器越不愿意产生较大的航向修正。
    # 怎么设置：IMU/航向很可靠时可较大；航向估计偏差明显时过大可能限制扫描匹配纠正。
    angle_variance_penalty: 1.0

    # 功能：设置精细角度搜索的偏移参数，单位 rad。
    # 参数作用：控制最终角度精细匹配尺度；0.00349 rad 约 0.2°。
    # 怎么设置：通常保持较小值；增大可能降低角精度，过小会增加搜索成本且收益有限。
    fine_search_angle_offset: 0.00349

    # 功能：设置粗角度搜索允许覆盖的角度范围，单位 rad。
    # 参数作用：初始航向误差较大时，需要更大的粗搜索范围。
    # 怎么设置：0.349 rad 约 20°；如果里程计航向经常误差超过该范围，可适当增大，
    #           但范围越大计算量和错误匹配风险越高。
    coarse_search_angle_offset: 0.349

    # 功能：设置粗角度搜索步长，单位 rad。
    # 参数作用：步长越小搜索更细但更慢；0.0349 rad 约 2°。
    # 怎么设置：一般先保持；粗匹配角度不稳定且算力允许可小幅减小。
    coarse_angle_resolution: 0.0349

    # 功能：限制角度偏移惩罚最低可以降到多少。
    # 参数作用：防止较大角度偏移被评分惩罚得过度或过少（由算法内部使用）。
    # 怎么设置：属于高级匹配参数，地图正常时保持 0.9，不建议优先调整。
    minimum_angle_penalty: 0.9

    # 功能：限制距离偏移惩罚最低可以降到多少。
    # 参数作用：控制平移候选偏离预测位置时评分下降的下限。
    # 怎么设置：属于高级参数，当前 0.5 建议先保持；优先先调搜索窗口和关键帧参数。
    minimum_distance_penalty: 0.5

    # 功能：当初始相关性响应较弱时，是否扩大/扩展响应搜索以寻找更好候选。
    # 参数作用：可提高困难场景匹配成功率，但会增加额外搜索成本。
    # 怎么设置：一般保持 true；CPU 极度受限且匹配本身稳定时才考虑关闭做对比。
    use_response_expansion: true

    # 功能：设置一个栅格在被用于占用估计前需要的最小“穿过/观测”次数。
    # 参数作用：可以减少单次偶然观测对地图栅格状态的影响。
    # 怎么设置：当前 2 比较保守；地图出现很多一次性噪点可适当增大，
    #           但过大会让地图建立变慢或细小结构难出现。
    min_pass_through: 2

    # 功能：设置将栅格判定为占用状态时使用的概率/评分阈值。
    # 参数作用：阈值会影响最终 OccupancyGrid 中障碍栅格的判定敏感度。
    # 怎么设置：属于高级地图生成参数；当前 0.1 建议保持，
    #           除非已经通过实际地图观察确认障碍过于稀疏或过于膨胀，再小幅调整。
    occupancy_threshold: 0.1

    # --------------------------------------------------------
    # map_and_localization 节点专用参数
    # --------------------------------------------------------
    # 说明：本包默认用 map_and_localization_slam_toolbox_node 启动（见
    #       launch/slam_map_then_localization.launch.py）。相比 online_async，
    #       它额外支持运行时把 mode 在 mapping / localization 之间切换。

    # 功能：localization 模式下要加载的地图/位姿图文件名（不含扩展名）。
    # 参数作用：以 localization 启动时从这里读入已有地图。
    # 怎么设置：首轮建图（mapping）留空 ""；后续以 localization 重启时填
    #           "/home/用户/my_map"。运行时切换 mode 不需要它。
    map_file_name: ""

    # 功能：localization 模式启动时的初始位姿 [x, y, yaw]。
    # 参数作用：把机器人直接放到地图中的已知位置，省去手动重定位。
    # 怎么设置：实时运行时切换 mode 无需关心；以 localization 重启且已知
    #           起点时再填写。
    map_start_pose: [0.0, 0.0, 0.0]
