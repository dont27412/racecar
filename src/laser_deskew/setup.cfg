# 功能：指定 `colcon build` 后 Python 可执行脚本安装到哪个目录。
# 参数作用：ROS 2 的 `ros2 run` 会按这个目录结构查找可执行文件。
# 怎么设置：目录中的 laser_deskew 必须与功能包名一致；正常不需要修改。
[develop]
script_dir=$base/lib/laser_deskew

# 功能：指定正式 install 阶段脚本安装目录。
# 怎么设置：同样保持 $base/lib/<package_name>；如果改包名，需要同步修改这里。
[install]
install_scripts=$base/lib/laser_deskew
