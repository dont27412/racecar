# ============================================================
# laser_deskew 参数配置
# ============================================================
# 功能：
#   使用里程计补偿旋转式 2D 激光雷达在“一圈扫描期间”由于车辆运动产生的几何畸变。
#
# 调参原则：
#   1. 先确认话题名和雷达安装外参；这两类参数错了，去畸变一定不正确。
#   2. 再确认 LaserScan 时间戳代表“扫描开始”还是“扫描结束”。
#   3. 再确认雷达原始方位角随时间是递增还是递减。
#   4. scan_duration 应接近真实扫描周期，例如 10 Hz 雷达约为 0.10 s。
#   5. odom_history_seconds / max_extrapolation 主要解决消息延迟和时间不同步问题，
#      不应靠无限调大它们来掩盖时间戳错误。
#
# 单位：
#   距离：m
#   时间：s
#   角度：rad

laser_deskew:
  ros__parameters:

    # --------------------------------------------------------
    # 输入 / 输出话题
    # --------------------------------------------------------

    # 功能：指定原始 LaserScan 输入话题。
    # 参数作用：节点从这个话题读取“尚未去畸变”的激光扫描。
    # 怎么设置：
    #   - 用 `ros2 topic list` 找雷达驱动发布的 LaserScan 话题。
    #   - 常见是 /scan；如果驱动发布成其他名字，就改成实际话题名。
    #   - 不要设成 output_scan，否则会形成自己订阅自己发布的回环。
    input_scan: /scan

    # 功能：指定用于运动补偿的里程计输入话题。
    # 参数作用：节点根据该里程计插值得到每束激光采样时刻的机器人位姿。
    # 怎么设置：
    #   - 优先使用已经融合轮速/IMU、时间连续且频率较高的里程计，如 /odom_combined。
    #   - 可用 `ros2 topic hz /odom_combined` 检查频率；通常越高越有利于插值。
    #   - 该里程计的位姿应表示 odom -> akm_rear_axle_footprint。
    input_odom: /odom_combined

    # 功能：指定去畸变后的 LaserScan 输出话题。
    # 参数作用：SLAM / 导航应订阅这个话题，才能使用补偿后的数据。
    # 怎么设置：
    #   - 推荐保持独立话题，例如 /scan_deskewed，方便同时对比原始 /scan。
    #   - 如果下游 SLAM 使用去畸变数据，应把它的 scan_topic 改成这里的值。
    output_scan: /scan_deskewed

    # --------------------------------------------------------
    # 雷达相对 AKM 运动学参考点的二维安装外参
    # --------------------------------------------------------
    # 这 3 个值描述：akm_rear_axle_footprint -> laser 的平面变换。
    # 外参如果填错，车辆旋转时尤其容易出现“越补偿越弯”的现象。

    # 功能：设置雷达中心相对 akm_rear_axle_footprint 的前后方向偏移。
    # 参数作用：参与把底盘位姿换算成雷达位姿。
    # 怎么设置：
    #   - 雷达在运动学参考点前方：填正值；后方：填负值。
    #   - akm_rear_axle_footprint -> base_footprint 的 x = 0.17 m；
    #     base_link -> laser_link 的 x = 0.08 m。
    #   - 因此 akm_rear_axle_footprint -> laser_link 的 x = 0.17 + 0.08 = 0.25 m。
    laser_x: 0.25

    # 功能：设置雷达中心相对 akm_rear_axle_footprint 的左右方向偏移。
    # 参数作用：车辆旋转时，横向安装偏移会影响雷达真实运动轨迹。
    # 怎么设置：
    #   - 按 ROS REP-103 坐标约定，左侧通常为 +y，右侧为 -y。
    #   - 直接使用 TF 中 akm_rear_axle_footprint -> laser_link 的 y。
    #   - 雷达位于车辆中心线时设置 0.0。
    laser_y: 0.0

    # 功能：设置雷达朝向相对 akm_rear_axle_footprint x 正方向的偏航角。
    # 参数作用：决定雷达坐标系与底盘坐标系之间的平面旋转关系。
    # 怎么设置：
    #   - 雷达正前方与底盘正前方一致：0.0。
    #   - 左转 90°：约 +1.5708；右转 90°：约 -1.5708。
    #   - 最可靠的方法是读取 TF/URDF 中对应 yaw，而不是目测猜测。
    laser_yaw: 0.0

    # --------------------------------------------------------
    # 单圈扫描时间
    # --------------------------------------------------------

    # 功能：提供“一圈激光扫描持续时间”的默认值。
    # 参数作用：第一帧无法通过相邻时间戳估计周期，或时间戳异常时，用它作为备用值。
    # 怎么设置：
    #   - 近似等于 1 / 雷达扫描频率。
    #   - 例如 10 Hz -> 0.10 s；20 Hz -> 0.05 s。
    #   - 可执行 `ros2 topic hz /scan`，用平均频率的倒数作为初始值。
    #   - 设置错误会导致每束激光的采样时间重建不准，从而欠补偿或过补偿。
    scan_duration: 0.10

    # 功能：限定自动估计扫描周期时允许的最小值。
    # 参数作用：过滤异常小的相邻 scan 时间间隔，防止错误时间戳被当成真实扫描周期。
    # 怎么设置：
    #   - 应明显小于正常 scan_duration，但仍大于不可能出现的异常间隔。
    #   - 10 Hz 雷达正常约 0.10 s，0.03 s 是较宽松的下限。
    #   - 如果你的雷达本身高于约 33 Hz，需要相应减小此值。
    min_scan_duration: 0.03

    # 功能：限定自动估计扫描周期时允许的最大值。
    # 参数作用：过滤卡顿、丢帧或异常时间戳造成的超大周期。
    # 怎么设置：
    #   - 应大于正常 scan_duration，并留出少量抖动/偶发丢帧余量。
    #   - 10 Hz 雷达正常约 0.10 s，0.30 s 可容忍一定延迟。
    #   - 若经常触发备用周期，应先检查驱动和系统时间，而不是一味调大。
    max_scan_duration: 0.30

    # --------------------------------------------------------
    # LaserScan 时间戳定义
    # --------------------------------------------------------

    # 功能：说明 LaserScan.header.stamp 表示一圈扫描的“结束时刻”还是“开始时刻”。
    # 参数作用：决定整圈扫描的时间区间 [t_start, t_end] 如何计算。
    # 怎么设置：
    #   - true：header.stamp 是扫描结束时间。
    #   - false：header.stamp 是扫描开始时间。
    #   - 当前 X10 驱动源码使用 sweep_end_time 作为 header.stamp，因此设为 true。
    #   - 如果换雷达/换驱动，必须查看驱动源码或文档确认，不能凭经验猜。
    stamp_is_end: true

    # --------------------------------------------------------
    # 雷达扫描方向
    # --------------------------------------------------------

    # 功能：说明“原始方位角”随采样时间是递增还是递减。
    # 参数作用：节点依靠它把每个角度 bin 映射回该束激光在一圈中的采样时刻。
    # 怎么设置：
    #   - true ：原始方位角随时间大体按 0° -> 90° -> 180° -> 360° 增加。
    #   - false：原始方位角随时间大体按 360° -> 270° -> 180° -> 0° 减少。
    #   - 推荐运行项目中的 `check_scan_direction.py` 检测，它会直接给出建议值。
    #   - 如果 RViz 中去畸变结果比原始数据更弯，可优先检查/反转此参数做对比。
    raw_azimuth_increases: true

    # --------------------------------------------------------
    # 里程计缓存 / 时间容错
    # --------------------------------------------------------

    # 功能：设置节点保留多少秒的历史里程计数据。
    # 参数作用：去畸变需要查询“一圈扫描期间”的历史位姿，缓存过短会找不到旧位姿。
    # 怎么设置：
    #   - 必须大于 scan_duration，并应覆盖正常消息延迟。
    #   - 一般 1~3 s 已足够；当前 2.0 s 比 0.10 s 扫描周期宽裕很多。
    #   - 如果提示 `cannot bracket scan ... with odom history`，可适当增大；
    #     但若需要非常大，优先检查 scan/odom 时间戳是否来自同一时钟。
    odom_history_seconds: 2.0

    # 功能：允许查询时刻稍微超出当前里程计缓存边界。
    # 参数作用：在 scan 与 odom 存在几毫秒到几十毫秒到达抖动时，避免立刻丢帧。
    # 怎么设置：
    #   - 建议尽量小，只覆盖正常时间抖动。
    #   - 0.01~0.05 s 是常见起点；当前设置 0.03 s。
    #   - 调太大会使用“保持最近位姿”近似外推，快速运动时会降低补偿精度。
    #   - 如果必须设得很大才能工作，应排查时间同步，而不是继续放宽。
    max_extrapolation: 0.03

    # 功能：限制“等待未来里程计数据”的 LaserScan 最大缓存帧数。
    # 参数作用：当 odom 延迟或中断时，防止 pending 队列无限增长占用内存并增加延迟。
    # 怎么设置：
    #   - 需要至少能覆盖正常 odom 延迟。
    #   - 10 Hz 激光下 5 帧约对应 0.5 s 的队列容量，通常已经比较宽松。
    #   - 如果频繁出现 `pending queue overflow`，先检查 odom 是否掉线/延迟；
    #     只有系统确实存在较大但正常的延迟时才增加该值。
    pending_scan_limit: 5
