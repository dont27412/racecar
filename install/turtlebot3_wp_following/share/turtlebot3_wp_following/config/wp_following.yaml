# Waypoint list used by the turtlebot3_wp_following package.
#
# Format A (as saved by the RViz waypoint tool):
#   waypointN:
#     pose: [x, y, z]
#     orientation: [w, x, y, z]   # quaternion, w FIRST
#
# The node sends this whole list to Nav2 at once using the
# NavigateThroughPoses action. Nav2 plans a single global path through all the
# waypoints and drives it without stopping in between, publishing it on /plan,
# which is shown as the red "Path" on the RViz map.

